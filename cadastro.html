<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizzaria Delícia - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <h1>Pizzaria Delícia</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Início</a></li> 
        <li><a href="#sabores">Sabores</a></li>
        <li><a href="#promocoes">Promoções</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>
            <div class="form-container">
                <h1>Entrar</h1>
                <p>faça cadastro para acessar seu perfil e acompanhar seus pedidos.</p>

                <form action="${pageContext.request.contextPath}/CadastrarUsuarioServlet" method="post" class="form-cadastro">
                    <label for="nome">nome: </label>
                    <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>

                    <label for="email">e-mail: </label>
                    <input type="email" id="email" name="email" placeholder="digite seu email" required>

                    <label for="telefone">telefone: </label>
                    <input type="text" id="telefone" name="telefone" placeholder="digite seu telefone" required>

                    <label for="senha">senha: </label>
                    <input type="password" id="senha" name="senha" placeholder="digite seu senha" required>

                    <label for="consenha">confirmar senha: </label>
                    <input type="password" id="consenha" name="consenha" placeholder="confirme sua senha" required>

                    <button type="submit" class="btn-enviar">
                        <i class="bi bi-door-open-fill"></i>
                        cadastrar                    
                    </button>
                </form>
                <div class="link-cadastro">
                    <p>tem conta?</p>
                    <a href="${pageContext.request.contextPath}/jsp/login" class="btn-cadastrar">
                        <i class="bi bi-person-plus-fill"></i> login
                    </a>
                </div>
            </div>
        </div>
</body>
</html>
